# Fourmolu configuration for Haskell by Example
# https://fourmolu.github.io/config/

# Indentation
indentation: 2
column-limit: 100
function-arrows: trailing
comma-style: leading
import-export-style: diff-friendly
indent-wheres: false
record-brace-space: false
newlines-between-decls: 1
haddock-style: multi-line
haddock-style-module: null
let-style: auto
in-style: right-align
single-constraint-parens: always
single-deriving-parens: always
unicode: never
respectful: true
fixities: []
extensions:
  - ImportQualifiedPost
  - OverloadedStrings
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - GADTs
  - DataKinds
  - TypeFamilies
  - TemplateHaskell
  - RankNTypes
