name: chapter17
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 17: Веб-приложение с БД (Scotty + persistent)"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src
  dependencies:
    - text
    - aeson
    - containers
    - servant
    - servant-server
    - warp
    - persistent
    - persistent-sqlite
    - persistent-template
    - monad-logger
    - resourcet
    - resource-pool
    - transformers
    - mtl
    - http-types
    - bytestring

executables:
  chapter17-server:
    main: Main.hs
    source-dirs: app
    dependencies:
      - chapter17
      - servant-server
      - warp
      - monad-logger
      - persistent-sqlite

tests:
  chapter17-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter17
      - hspec
      - hspec-wai
      - hspec-wai-json
      - text
      - aeson
      - containers
      - servant
      - servant-server
      - wai
      - wai-extra
      - http-types
      - bytestring
      - persistent
      - persistent-sqlite
      - monad-logger
      - resourcet
