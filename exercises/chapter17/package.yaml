name: chapter17
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 17: Веб-приложение с БД (Scotty + persistent)"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src
  dependencies:
    - text
    - aeson
    - containers

tests:
  chapter17-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter17
      - hspec
      - text
      - aeson
      - containers
