name: chapter18
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 18: DSL и парсеры (megaparsec)"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src
  dependencies:
    - text
    - megaparsec
    - containers

tests:
  chapter18-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter18
      - hspec
      - text
      - megaparsec
