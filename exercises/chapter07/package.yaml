name: chapter07
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 7: IO: взаимодействие с миром"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5
  - containers
  - text

library:
  source-dirs: src

tests:
  chapter07-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter07
      - hspec
      - directory
