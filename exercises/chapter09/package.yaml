name: chapter09
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 9: Ленивость, строгость и производительность"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost
  - BangPatterns

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src

tests:
  chapter09-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter09
      - hspec
