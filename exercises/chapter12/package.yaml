name: chapter12
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 12: Приключения с монадами"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5
  - mtl
  - containers
  - aeson
  - bytestring

library:
  source-dirs: src

tests:
  chapter12-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter12
      - hspec
      - directory
