name: chapter03
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 3: Алгебраические типы и паттерн-матчинг"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src

tests:
  chapter03-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter03
      - hspec
