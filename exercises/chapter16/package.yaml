name: chapter16
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 16: Конкурентность и async"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src
  dependencies:
    - containers
    - stm
    - async

tests:
  chapter16-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter16
      - hspec
      - stm
      - async
