name: chapter10
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 10: Тестирование: hspec и QuickCheck"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src
  dependencies:
    - containers

tests:
  chapter10-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter10
      - hspec
      - QuickCheck
      - containers
