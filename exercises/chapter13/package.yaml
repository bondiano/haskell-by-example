name: chapter13
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 13: Трансформеры и mtl"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src
  dependencies:
    - containers
    - mtl
    - transformers

tests:
  chapter13-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter13
      - hspec
      - containers
      - mtl
      - transformers
