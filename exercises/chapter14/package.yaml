name: chapter14
version: 0.1.0.0
synopsis: "Haskell by Example — Глава 14: JSON и сериализация"
license: MIT

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - LambdaCase
  - ScopedTypeVariables
  - TypeApplications
  - NamedFieldPuns
  - RecordWildCards
  - TupleSections
  - NumericUnderscores
  - ImportQualifiedPost

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src
  dependencies:
    - aeson
    - bytestring
    - text

tests:
  chapter14-tests:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - chapter14
      - hspec
      - aeson
      - bytestring
      - text
